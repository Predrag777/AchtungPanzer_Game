<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <div id="loading-content">
                <img src="loading.gif" alt="Loading...">
            </div>
        </div>
        <!-- After the loading screen div, before closing body or after canvas, add: -->
        <div id="fade-overlay" style="
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.6s ease;
        "></div>
    </div>
</body>
</html>
